[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-aruco"
version = "0.1.0"
description = "OpenCV ArUco detection, calibration, and pose estimation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Flask==3.1.3",
  "numpy==2.4.4",
  "opencv-contrib-python==4.13.0.92",
  "PyYAML==6.0.3",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
