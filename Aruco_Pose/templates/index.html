<body>
    <div class="container">
        <h1>Live Aruco Stream</h1>
        
        <div class="stream-container">
            <img id="camera-stream" src="/video_feed" alt="Camera stream" width="854" height="480">
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="marker-id-input">Marker ID:</label>
                <input type="number" id="marker-id-input" min="0" value="5" style="width: 80px; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #444; color: #fff;">
                <button id="capture-pose-btn">Capture Pose</button>
                <label class="toggle-label">
                    <input type="checkbox" id="debug-toggle">
                    Debug mode
                </label>
            </div>
            <div id="capture-status" style="margin-top: 15px;"></div>
            <div class="status">
                <p>Pose file: pose_calibration.json</p>
            </div>
        </div>
    </div>
    
    <script>
        const captureStatus = document.getElementById('capture-status');
        const capturePoseBtn = document.getElementById('capture-pose-btn');
        const markerIdInput  = document.getElementById('marker-id-input');
        const debugToggle    = document.getElementById('debug-toggle');

        capturePoseBtn.addEventListener('click', function() {
            const markerId = parseInt(markerIdInput.value);
            const debug    = debugToggle.checked;

            if (isNaN(markerId)) {
                captureStatus.textContent = 'Error: Please enter a valid marker ID';
                captureStatus.style.color = '#FF6B6B';
                return;
            }

            capturePoseBtn.disabled = true;
            captureStatus.textContent = debug ? 'Capturing (debug)...' : 'Capturing pose...';
            captureStatus.style.color = '#FFD700';

            fetch('/capture_pose', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ marker_id: markerId, debug: debug })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    captureStatus.textContent = `Pose captured for marker ${markerId}${debug ? ' (debug)' : ''}`;
                    captureStatus.style.color = '#4CAF50';
                } else {
                    captureStatus.textContent = `Error: ${data.message}`;
                    captureStatus.style.color = '#FF6B6B';
                }
                capturePoseBtn.disabled = false;
            })
            .catch(err => {
                captureStatus.textContent = `Error: ${err.message}`;
                captureStatus.style.color = '#FF6B6B';
                capturePoseBtn.disabled = false;
            });
        });
        
        // Allow Enter key to capture pose
        markerIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                capturePoseBtn.click();
            }
        });
    </script>
